<style>
:root{--ink:#0e0c0a;--paper:#f2e6cd;--gold:#c9a227;--gold2:#e8c766;--dim:#a1957f;--line:#3a2f26}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:32px 20px;background:
    radial-gradient(120% 62% at 50% -10%,rgba(201,162,39,.17),transparent 62%),

.box{max-width:520px;text-align:center}
.seal{width:64px;height:64px;margin:0 auto 26px;border:1px solid rgba(179,56,44,.6);border-radius:10px;
  display:flex;align-items:center;justify-content:center;transform:rotate(-6deg);
  font-family:"Songti SC","SimSun",serif;font-size:34px;color:rgba(179,56,44,.72)}
.code{font-family:"Songti SC","SimSun",serif;font-size:clamp(52px,14vw,84px);font-weight:900;
  letter-spacing:.08em;line-height:1;color:transparent;
  background:linear-gradient(180deg,#f6e5b8,#c9a227 58%,#8c6f18);
  -webkit-background-clip:text;background-clip:text}
h1{margin:18px 0 0;font-family:"Songti SC","SimSun",serif;font-size:20px;font-weight:600;letter-spacing:3px;color:var(--paper)}
p{margin:14px 0 0;font-size:13.5px;line-height:1.9;color:var(--dim)}
a{display:inline-block;margin-top:28px;padding:13px 26px;border-radius:13px;text-decoration:none;
  font-family:"Songti SC","SimSun",serif;font-size:15px;letter-spacing:3px;color:#ffe9c9;
  background:linear-gradient(180deg,#8f2c22,#6b1f18);border:1px solid #c0392b;
  box-shadow:0 10px 26px rgba(179,56,44,.32),inset 0 1px 0 rgba(255,255,255,.14)}
a:hover{box-shadow:0 14px 32px rgba(179,56,44,.4),inset 0 1px 0 rgba(255,255,255,.16)}
